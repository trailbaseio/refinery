[package]
name = "trailbase-refinery-macros"
version = "0.8.15"
authors = ["TrailBase <contact@trailabse.io>"]
description = "Fork of Refinery's refinery-macros crate"
license = "MIT OR Apache-2.0"
repository = "https://github.com/trailbaseio/refinery"
edition = "2018"
readme = "../README.md"

[features]
enums = []

[lib]
proc-macro = true

[dependencies]
trailbase-refinery-core = { version = "0.8.14", path = "../refinery_core" }
quote = "1"
syn = "2"
proc-macro2 = "1"
regex = "1"
heck = "0.5"

[dev-dependencies]
tempfile = "3"
